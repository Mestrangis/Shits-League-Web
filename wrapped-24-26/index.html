@font-face{font-family:Sora;font-weight:400;src:url(fuentes/sora-400.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:700;src:url(fuentes/sora-700.woff2) format('woff2')}
:root{--verde:#1FE065;--rojo:#FF4D5E;--fondo:#0A0C0B;--tinta:#F2F5F3;--gris:#8A938E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--tinta);font-family:Sora,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#elegir{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:50;font:600 14px Sora;padding:6px 10px;border-radius:10px;background:#1b1f1d;color:#fff;border:1px solid #333}
#escena{position:absolute;left:50%;top:50%;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));transform:translate(-50%,-50%);overflow:hidden;background:var(--fondo);container-type:size}
/* unidades relativas al ancho de la escena */
.s{position:absolute;inset:0;padding:16cqw 8cqw 10cqw;display:flex;flex-direction:column;justify-content:center}
#cerrar{position:absolute;top:5.4cqw;right:3cqw;width:8cqw;height:8cqw;padding:1.6cqw;z-index:45;opacity:.9}
#barras{position:absolute;top:3.2cqw;left:3cqw;right:3cqw;display:flex;gap:1.2cqw;z-index:20}
#barras i{flex:1;height:.9cqw;border-radius:1cqw;background:rgba(255,255,255,.25);overflow:hidden}
#barras i b{display:block;height:100%;width:0;background:#fff}
#marca{position:absolute;top:6.4cqw;left:3.4cqw;z-index:20;font:700 3.1cqw Sora;letter-spacing:.06em;opacity:.85;display:flex;align-items:center;gap:1.6cqw}
#marca span{color:var(--verde)}
.etq{font:700 3.6cqw Sora;letter-spacing:.14em;text-transform:uppercase;color:var(--verde)}
.ant{font-family:Anton;text-transform:uppercase;line-height:.9;letter-spacing:.005em}
.gris{color:var(--gris)}
.txt{font-size:4.6cqw;line-height:1.35}
.verde{color:var(--verde)}.rojo{color:var(--rojo)}

/* animaciones de entrada */
.e{opacity:0;animation:sube .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes sube{from{opacity:0;transform:translateY(6cqw)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.pausa *{animation-play-state:paused!important}

/* fondo: franjas de césped */

@keyframes desliza{to{transform:translateX(18cqw)}}
.mancha{position:absolute;border-radius:50%;filter:blur(18cqw);opacity:.55}

/* 1 portada */
.portada .ant.grande{font-size:30cqw;color:var(--verde)}
.portada .nombre{font-size:15cqw;margin-top:3cqw}
/* 2 partidos */
.num{margin-top:5cqw;font-family:Anton;font-size:52cqw;line-height:.85;color:var(--verde)}
.num small{font-size:16cqw;color:var(--gris)}
/* 3 balance */
.ved{display:flex;gap:3cqw;margin:6cqw 0 5cqw}
.ved div{flex:1;border-radius:4cqw;padding:4cqw 0 3cqw;text-align:center;background:#151917}
.ved b{display:block;font:400 19cqw/1 Anton}
.ved span{font:700 3.2cqw Sora;letter-spacing:.12em;color:var(--gris)}
.barra{display:flex;height:3.4cqw;border-radius:2cqw;overflow:hidden;background:#151917}
.barra i{height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
/* 4 goles */
.par{display:flex;gap:4cqw;margin:5cqw 0}
.par>div{flex:1;background:#151917;border-radius:5cqw;padding:5cqw 4cqw;position:relative;overflow:hidden}
.par svg{width:9cqw;height:9cqw;color:var(--verde)}

.par .rk{font:700 3.6cqw Sora;color:var(--gris)}
.par .rk em{font-style:normal;color:var(--tinta)}

.o{font-family:Sora;font-weight:700;font-size:.42em;vertical-align:.95em;margin-left:.04em}

.q .ic svg{width:6.4cqw;height:6.4cqw}
.q .t{flex:1;min-width:0}
.q .t span{font:700 3cqw Sora;letter-spacing:.12em;text-transform:uppercase;color:var(--gris)}

.q .r{font:700 3.6cqw Sora;text-align:right;white-space:nowrap}
.q .r i{font-style:normal;display:inline-block;margin-left:1cqw}
/* 8 evolucion */

.graf .linea{fill:none;stroke:var(--verde);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}

.tarjeta .rej{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw;padding:3cqw 5cqw 5cqw}
.tarjeta .rej div{background:#1a1f1c;border-radius:3cqw;padding:2.6cqw 0 2cqw;text-align:center}

#inicio .play{width:22cqw;height:22cqw;border-radius:50%;background:var(--verde);display:grid;place-items:center;animation:late 1.4s ease-in-out infinite}

  const linea=m.g+m.a===0?`Victoria ${m.f}-${m.c}`:[m.g&&`${m.g} ${pl(m.g,'gol','goles')}`,m.a&&`${m.a} ${pl(m.a,'asistencia','asistencias')}`].filter(Boolean).join(' · ');
  S.push({dur:5600,html:`<div class="fondofoto" style="background-image:url(${foto})"></div><div class="s" style="justify-content:flex-start;padding-top:20cqw"><div class="etq e">Tu mejor partido</div>
    <div class="foto pop" style="animation-delay:.25s"><div class="marco" style="background-image:url(${foto})"></div><div class="sello">J${m.j}</div></div>
    <div class="ant e" style="font-size:20cqw;animation-delay:.8s">${m.f}-${m.c}</div>
    <div class="txt e" style="animation-delay:1.2s;margin-top:2cqw"><b>${linea}</b> <span class="gris">· ${fecha(m.fecha)}</span></div></div>`});
  // 6 contigo en el campo
  const signo=p.dif>0?'+':p.dif<0?'−':'';
  const extra=p.dif===maxDe('dif')?'La mejor de la liga.':p.dif===minDe('dif')?'La peor de la liga.':'';
  S.push({dur:5000,html:`<div class="s"><div class="etq e">Contigo en el campo</div>
    <div class="dif pop ${p.dif>0?'verde':p.dif<0?'rojo':''}" style="animation-delay:.25s">${signo}<span data-n="${Math.abs(p.dif)}">0</span></div>
    <div class="ant e" style="font-size:9cqw;animation-delay:.9s;margin-top:2cqw">de diferencia de goles</div>
    <div class="txt e" style="animation-delay:1.5s;margin-top:4cqw">Tu equipo encajó <b>${String(p.gcpp).replace('.',',')}</b> goles por partido. <span class="gris">${extra}</span></div></div>`});
  // 7 química
  const vicOk=p.vic.v>p.vic.d;
  const fila=(k,et,col,r,txt,ex)=>`<div class="q e" style="animation-delay:${.3+k*.45}s"><div class="ic" style="background:${col}22;color:${col}">${ICQ[et]}</div><div class="t"><span>${txt}</span><b>${r?r.n:'Nadie'}</b><em>${ex}</em></div><div class="r">${r?reg(r):'<i class="gris">Ni uno</i>'}</div></div>`;
  S.push({dur:8500,html:`<div class="s"><div class="etq e">Química</div>
    <div class="txt gris e" style="animation-delay:.1s;margin:1cqw 0 1cqw">Tus resultados con y contra cada uno.</div>
    ${fila(0,'comp','#1FE065',p.comp,'Tu compañero habitual','Con quien más has jugado en el mismo equipo')}
    ${fila(1,'riv','#F5C542',p.riv,'Tu rival habitual','Contra quien más veces has jugado')}
    ${fila(2,'vic','#5AA9FF',vicOk?p.vic:null,'Tu víctima','El rival al que mejor se te da ganar')}
    ${fila(3,'mal','#FF4D5E',p.mal,'Tu pareja maldita','El compañero con el que más pierdes')}</div>`});
  // 8 evolución
  const n=p.evo.length, N=todos.length, W=100, H=62, px=i=>4+i*(W-8)/(n-1), py=v=>4+(v-1)*(H-8)/(N-1);
  const pts=p.evo.map((v,i)=>`${px(i).toFixed(2)},${py(v).toFixed(2)}`).join(' ');
  const best=Math.min(...p.evo), bj=p.evo.indexOf(best)+1, fin=p.evo[n-1];
  const rej=[1,5,10,15].map(v=>`<line x1="0" x2="${W}" y1="${py(v)}" y2="${py(v)}" stroke="#ffffff14" stroke-width=".3"/><text x="0" y="${py(v)-1}" fill="#8A938E" font-size="3.4" font-family="Sora" font-weight="700">${v}º</text>`).join('');
  S.push({dur:6400,html:`<div class="s"><div class="etq e">Tu temporada, jornada a jornada</div>
    <svg class="graf e" viewBox="0 0 ${W} ${H}" style="animation-delay:.2s">${rej}
      <polyline class="linea" points="${pts}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin="indefinite" dur="2.4s" fill="freeze" calcMode="spline" keySplines=".4 0 .2 1" keyTimes="0;1"/></polyline>
      <circle cx="${px(n-1)}" cy="${py(fin)}" r="2.2" fill="#1FE065" opacity="0"><animate attributeName="opacity" to="1" begin="indefinite" dur=".3s" fill="freeze"/></circle></svg>
    <div class="ant e" style="font-size:14cqw;animation-delay:2.4s">Acabaste <span class="verde">${fin}<span class=o>º</span></span></div>
    <div class="txt e gris" style="animation-delay:2.9s;margin-top:2cqw">${best===fin?'Tu mejor puesto, justo al final.':`Llegaste a estar <b style="color:#fff">${best}º</b> en la J${bj}.`}</div></div>`,graf:true});
  // 9 MVP
  if(p.mvp>0) S.push({dur:4400,html:`<div class="s" style="align-items:center;text-align:center"><div class="etq e">MVP</div>
    <div class="pop" style="animation-delay:.2s;width:30cqw;height:30cqw;color:#F5C542;margin:5cqw 0">${IC.mvp}</div>
    <div class="ant e" style="font-size:24cqw;animation-delay:.6s"><span data-n="${p.mvp}">0</span> ${pl(p.mvp,'vez','veces')}</div>
    <div class="txt e" style="animation-delay:1.2s;margin-top:3cqw">${p.mvp===maxDe('mvp')?'<b class="verde">Nadie lo fue más.</b>':'El mejor del partido.'}</div></div>`});
  // 10 título
  S.push({dur:5600,html:`<div class="s titulo"><div class="cesped"></div><div style="position:relative">
    <div class="txt e" style="animation-delay:.2s">Eres…</div>
    <div class="ant nom">${p.titulo}</div>
    <div class="txt e" style="animation-delay:2.5s">${p.tit_txt}</div></div><div class="flash"></div></div>`});
  // 11 resumen
  S.push({dur:0,html:`<div class="s res"><div class="tarjeta pop" style="animation-delay:.1s">
    <div class="cab" style="background-image:url(${foto})"><div><div class="ant" style="font-size:15cqw">${p.nombre}</div><div class="chapa">${p.titulo}</div></div></div>
    <div class="rej">
      <div><b class="verde">${p.rk_pts}<span class=o>º</span></b><span>Puesto</span></div>
      <div><b>${p.pj}</b><span>Partidos</span></div>
      <div><b>${p.v}-${p.e}-${p.d}</b><span>V-E-D</span></div>
      <div><b>${p.g}</b><span>Goles</span></div>
      <div><b>${p.a}</b><span>Asistencias</span></div>
      <div><b>${p.mvp}</b><span>MVP</span></div>
    </div></div>
    <div class="txt gris e" style="text-align:center;margin-top:5cqw;animation-delay:.8s;font-size:3.6cqw">Shits League · Temporada 24/26</div></div>`});
  return S;
}

// motor de stories
const capa=document.getElementById('capa'),barras=document.getElementById('barras'),esc=document.getElementById('escena'),mus=document.getElementById('musica');
mus.volume=.35;
let S=[],i=0,t0=0,pausado=false,acum=0,raf=0;
function cuenta(el){const fin=+el.dataset.n,ini=performance.now(),dur=900+Math.min(fin,40)*18;
  (function f(now){const k=Math.min(1,(now-ini-250)/dur);el.textContent=Math.round(fin*(1-Math.pow(1-Math.max(0,k),3)));if(k<1)requestAnimationFrame(f)})(ini)}
function ir(n){
  i=Math.max(0,Math.min(S.length-1,n));acum=0;t0=performance.now();
  capa.innerHTML=S[i].html;
  capa.querySelectorAll('[data-n]').forEach(cuenta);
  setTimeout(()=>capa.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%'),950);
  if(S[i].graf){const as=capa.querySelectorAll('animate');setTimeout(()=>as[0].beginElement(),500);setTimeout(()=>as[1].beginElement(),2800)}
  [...barras.children].forEach((b,k)=>b.firstChild.style.width=k<i?'100%':'0');
  document.getElementById('marca').style.opacity=i===S.length-1?0:.85;
}
function tic(now){
  const s=S[i];
  if(!pausado&&s&&s.dur){const k=Math.min(1,(acum+now-t0)/s.dur);barras.children[i].firstChild.style.width=k*100+'%';if(k>=1&&i<S.length-1)ir(i+1)}
  else if(s&&!s.dur)barras.children[i].firstChild.style.width='100%';
  raf=requestAnimationFrame(tic)}
function cargar(nombre){
  S=slides(D[nombre]);barras.innerHTML=S.map(()=>'<i><b></b></i>').join('');ir(0);
}
// controles: toque izq/der, mantener = pausa
let abajo=0,tPausa=null;
esc.addEventListener('pointerdown',e=>{if(e.target.closest('#inicio,#cerrar'))return;abajo=performance.now();tPausa=setTimeout(()=>{pausado=true;acum+=performance.now()-t0;capa.classList.add('pausa')},180)});
esc.addEventListener('pointerup',e=>{if(e.target.closest('#inicio,#cerrar'))return;clearTimeout(tPausa);
  if(pausado){pausado=false;t0=performance.now();capa.classList.remove('pausa');return}
  const r=esc.getBoundingClientRect();ir(e.clientX-r.left<r.width*.3?i-1:i+1)});
document.getElementById('inicio').onclick=(e=>{e.currentTarget.remove();mus.currentTime=0;mus.play().catch(()=>{});cargar(sel.value)});
const sel=document.getElementById('elegir');
sel.innerHTML=Object.keys(D).sort((a,b)=>a.localeCompare(b,'es')).map(n=>`<option>${n}</option>`).join('');
// ?j=Nombre abre el Wrapped de ese jugador; ?todos=1 muestra el selector (admin)
const q=new URLSearchParams(location.search);
const nrm=s=>(s||'').normalize('NFD').replace(/[^a-zA-Z ]/g,'').trim().toLowerCase();
const buscar=n=>Object.keys(D).find(k=>nrm(k)===nrm(n));
const pedido=buscar(q.get('j'));
if(q.get('todos')!=='1') sel.style.display='none';
sel.value=pedido||Object.keys(D)[0];
sel.onchange=()=>{cargar(sel.value);mus.currentTime=0};
if(!pedido&&q.get('todos')!=='1'){document.getElementById('inicio').innerHTML='<div class="etq">No hay Wrapped para ti</div><div class="txt gris" style="text-align:center;padding:0 10cqw">Solo tienen Wrapped los que jugaron la temporada 24/26.</div>';document.getElementById('inicio').style.cursor='default';document.getElementById('inicio').onclick=null}
else{cargar(sel.value);requestAnimationFrame(tic);}
window.__ir=ir;window.__cargar=cargar;
</script>
