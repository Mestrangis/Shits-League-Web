<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shits League</title>
  <meta name="description" content="La liga de fútbol más competitiva del barrio. Clasificación, estadísticas, plantilla y resultados.">
  <meta name="theme-color" content="#06140D">
  <!-- PWA en iOS: barra de estado translúcida sobre la app (el topbar se separa con safe-area-inset-top) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/logo-s-green.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- Fuentes de Google sin bloquear el pintado (antes, un @import en main.css que esperaba a la red):
       se ve con la de reserva y cambia en cuanto llegan; después salen de la caché del service worker -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Sora:wght@400;500;600;700;800&amp;display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/rush-panel.css">
  <link rel="stylesheet" href="css/agujero.css">
</head>
<body>

  <!-- PULL-TO-REFRESH (app.js → refrescarPorGesto) -->
  <div class="ptr-spinner" id="ptrSpinner" role="status" aria-label="Actualizando"></div>

  <!-- BUBBLES (absolute, behind everything) -->
  <div id="bubbles" aria-hidden="true"></div>

  <!-- TOPBAR — sticky top:0 -->
  <header class="topbar">
    <div class="topbar__logo">
      <img class="topbar__logo-icon" src="assets/logo-s-green.png" alt="Shits League">
      <div class="topbar__logo-wordmark">
        <span class="topbar__logo-shits">SHITS</span>
        <span class="topbar__logo-league">LEAGUE</span>
      </div>
    </div>
    <div class="topbar__right">
      <div class="topbar__season" id="seasonToggle">
        <span class="topbar__season-dot"></span>
        <span id="seasonLabel"></span>
        <span class="topbar__season-arrow">▾</span>
        <div class="season-dropdown" id="seasonDropdown"></div>
      </div>
      <button class="session-btn" id="sessionBtn" type="button"></button>
    </div>
  </header>

  <div class="app-zona">
    <!-- BARRA DE PESTAÑAS: flota sobre las páginas (paginas.js la coloca) -->
    <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones">
      <div class="tabs__inner">
        <button class="tab tab--rush" data-tab="rush"         role="tab" aria-selected="false" hidden>Rush</button>
        <button class="tab active" data-tab="inicio"        role="tab" aria-selected="true">Inicio</button>
        <button class="tab"        data-tab="votacion"      role="tab" aria-selected="false" hidden>Partidos</button>
        <button class="tab"        data-tab="resumen"       role="tab" aria-selected="false">Resumen</button>
        <button class="tab"        data-tab="clasificacion" role="tab" aria-selected="false">Clasificación</button>
        <button class="tab"        data-tab="goleadores"    role="tab" aria-selected="false">Goleadores</button>
        <button class="tab"        data-tab="asistentes"    role="tab" aria-selected="false">Asistentes</button>
        <button class="tab"        data-tab="mvp"           role="tab" aria-selected="false">MVP</button>
        <button class="tab"        data-tab="plantilla"     role="tab" aria-selected="false">Plantilla</button>
        <span class="tabs__indicador" aria-hidden="true"></span>
      </div>
    </nav>

    <main class="main">
      <!-- PÁGINAS: cada pestaña con su scroll; el carril se mueve solo con transform -->
      <div class="paginas" id="paginas">
        <div class="paginas__pista" id="pista">
          <div class="pagina pagina--inicio" data-pagina="inicio">
            <!-- CABECERA: solo en Inicio, por encima de la barra -->
            <div class="hero-section" id="hero-section"></div>
            <div class="pagina__hueco"></div>
            <div class="tab-panel active" id="panel-inicio" role="tabpanel"></div>
            <!-- PIE: versión instalada y «Reparar la app» (js/version.js) -->
            <footer class="pie-app">
              <span data-version-app>Versión …</span>
              <button type="button" class="pie-app__reparar" data-reparar-app>Reparar la app</button>
            </footer>
          </div>
          <div class="pagina" data-pagina="rush"><div class="tab-panel" id="panel-rush" role="tabpanel"></div></div>
          <div class="pagina" data-pagina="votacion"><div class="tab-panel" id="panel-votacion" role="tabpanel"></div></div>
          <div class="pagina" data-pagina="mvp"><div class="tab-panel" id="panel-mvp" role="tabpanel"></div></div>
          <div class="pagina" data-pagina="resumen"><div class="tab-panel" id="panel-resumen" role="tabpanel"></div></div>
          <div class="pagina" data-pagina="clasificacion"><div class="tab-panel" id="panel-clasificacion" role="tabpanel"></div></div>
          <div class="pagina" data-pagina="goleadores"><div class="tab-panel" id="panel-goleadores" role="tabpanel"></div></div>
          <div class="pagina" data-pagina="asistentes"><div class="tab-panel" id="panel-asistentes" role="tabpanel"></div></div>
          <div class="pagina" data-pagina="plantilla"><div class="tab-panel" id="panel-plantilla" role="tabpanel"></div></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ARCHIVO DE TEMPORADAS ANTERIORES (oculto por defecto) -->
  <div class="archive-season" id="archiveSeason" hidden></div>

  <!-- MODAL — PARTIDO -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Detalle del partido">
    <div class="modal__backdrop"></div>
    <div class="modal__box" id="modalBox"></div>
  </div>

  <!-- MODAL — JUGADOR -->
  <div class="modal" id="playerModal" role="dialog" aria-modal="true" aria-label="Ficha del jugador">
    <div class="modal__backdrop"></div>
    <div class="modal__box" id="playerModalBox"></div>
  </div>

  <!-- MODAL — SESIÓN (login por código / cerrar sesión) -->
  <div class="modal" id="sessionModal" role="dialog" aria-modal="true" aria-label="Sesión de jugador">
    <div class="modal__backdrop"></div>
    <div class="modal__box dialog-box">
      <div id="sessionLogin">
        <h2 class="dialog-box__title">IDENTIFÍCATE</h2>
        <p class="dialog-box__text">Introduce tu código de jugador.</p>
        <input type="text" id="sessionCode" class="dialog-box__input" placeholder="Código"
          autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        <div id="sessionError" class="dialog-box__error" hidden>Código incorrecto</div>
        <button class="dialog-box__btn" id="sessionLoginBtn" type="button">ENTRAR</button>
      </div>
      <div id="sessionLogged" hidden>
        <div class="avatar dialog-box__avatar" id="sessionAvatar"></div>
        <h2 class="dialog-box__title" id="sessionLoggedName"></h2>
        <p class="dialog-box__text">Has iniciado sesión en este dispositivo.</p>
        <div class="perfil-app" id="sessionApp" hidden></div>
        <button class="dialog-box__btn dialog-box__btn--ghost" id="sessionLogoutBtn" type="button">CERRAR SESIÓN</button>
        <div class="perfil-admin" id="sessionAdmin" hidden></div>
      </div>
    </div>
  </div>

  <!-- MODAL — DESGLOSE DE VOTOS (pestaña Partidos) -->
  <div class="modal" id="votosModal" role="dialog" aria-modal="true" aria-label="Quién puede y quién no">
    <div class="modal__backdrop"></div>
    <div class="modal__box dialog-box" id="votosModalBox"></div>
  </div>

  <!-- MODAL — CONFIRMAR EL VOTO DEL MVP -->
  <div class="modal" id="mvpModal" role="dialog" aria-modal="true" aria-label="Confirmar el voto">
    <div class="modal__backdrop"></div>
    <div class="modal__box dialog-box">
      <h2 class="dialog-box__title">¿ENVIAR VOTO?</h2>
      <p class="dialog-box__text" id="mvpConfirmarTexto"></p>
      <button class="dialog-box__btn" id="mvpConfirmarSi" type="button">ENVIAR</button>
      <button class="dialog-box__btn dialog-box__btn--ghost" type="button" onclick="closeModal('mvpModal')">VOLVER</button>
    </div>
  </div>

  <!-- Versión de la app: service worker, «Hay una versión nueva» y actualización forzada -->
  <script src="js/version.js"></script>
  <script src="ajustes.js"></script>
  <script src="js/lector-ajustes.js"></script>
  <script src="js/temporadas.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/session.js"></script>
  <script src="js/push.js"></script>
  <script src="js/instalar-app.js"></script>
  <script src="js/votacion.js"></script>
  <script src="js/mvp.js"></script>
  <script src="js/inicio.js"></script>
  <script src="js/paginas.js"></script>
  <script src="js/rush-panel.js"></script>
  <script src="js/agujero-app.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
